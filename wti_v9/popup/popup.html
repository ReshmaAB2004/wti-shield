<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WTI Shield</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:380px;font-family:'Segoe UI',Arial,sans-serif;background:#060d1a;color:#e2e8f0}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes typingDot{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* Header */
.hdr{
  background:linear-gradient(135deg,#0a1628,#0d1e35);
  padding:11px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid #1e3354;
}
.hdr-logo{font-size:22px}
.hdr-title{font-size:12px;font-weight:800;color:#00c8ff;flex:1;letter-spacing:.5px}
.hdr-sub{font-size:9px;color:#334155;margin-top:1px}
.api-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;vertical-align:middle}
.on{background:#22c55e;animation:pulse 1.5s infinite}
.off{background:#ef4444}
.loc{background:#f59e0b;animation:pulse 1s infinite}

/* Status card */
.card{margin:8px;border-radius:12px;padding:14px;border:1px solid;position:relative;overflow:hidden;animation:fadeUp .3s ease}
.card-safe    {background:linear-gradient(135deg,#064e3b,#065f46);border-color:#22c55e44}
.card-sql     {background:linear-gradient(135deg,#7f1d1d,#991b1b);border-color:#ef444444}
.card-xss     {background:linear-gradient(135deg,#7c2d12,#9a3412);border-color:#f9731644}
.card-phishing{background:linear-gradient(135deg,#4a1d96,#5b21b6);border-color:#a855f744}
.card-ddos    {background:linear-gradient(135deg,#1e3a5f,#1e40af);border-color:#3b82f644}
.card-local   {background:linear-gradient(135deg,#78350f,#92400e);border-color:#f59e0b88}
.card-scanning{background:linear-gradient(135deg,#1a2235,#243049);border-color:#334155}
.ci{font-size:30px;margin-bottom:5px}
.cl{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.cu{font-size:10px;opacity:.55;word-break:break-all;margin-top:4px;max-height:30px;overflow:hidden}
.cs{font-size:9px;opacity:.6;margin-top:3px}
.cbar{margin-top:9px;background:rgba(0,0,0,.3);border-radius:3px;height:3px;overflow:hidden}
.cbar-fill{height:100%;background:rgba(255,255,255,.8);border-radius:3px;transition:width .5s}
.cbar-txt{font-size:9px;color:rgba(255,255,255,.5);margin-top:3px;text-align:right}

/* Buttons */
.btns{display:flex;gap:7px;margin:0 8px 8px;flex-wrap:wrap}
.btn{
  flex:1;padding:8px 10px;border:none;border-radius:8px;cursor:pointer;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  gap:5px;transition:all .2s;font-family:inherit;min-width:80px;
}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn-report{background:#1565c0;color:#fff}
.btn-chat{background:linear-gradient(135deg,#6d28d9,#7c3aed);color:#fff;position:relative}
.btn-local{background:linear-gradient(135deg,#d97706,#f59e0b);color:#1c1200}
.btn-ghost{background:#0d1e35;color:#94a3b8;border:1px solid #1e3354}
.chat-notif{
  position:absolute;top:-5px;right:-5px;
  background:#ef4444;color:#fff;border-radius:50%;
  width:16px;height:16px;font-size:9px;
  display:flex;align-items:center;justify-content:center;font-weight:900;
}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:0 8px 8px}
.stat{background:#0d1526;border:1px solid #1e3354;border-radius:8px;padding:7px;text-align:center}
.stat-n{font-size:18px;font-weight:800;color:#00c8ff}
.stat-l{font-size:9px;color:#475569;text-transform:uppercase;letter-spacing:.3px}

/* Threat rows */
.trows{margin:0 8px 8px;background:#0d1526;border:1px solid #1e3354;border-radius:8px}
.tr{display:flex;align-items:center;gap:7px;padding:6px 11px;border-bottom:1px solid #131f35;font-size:11px}
.tr:last-child{border-bottom:none}
.td{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tn{flex:1;color:#94a3b8}
.tc2{font-weight:700;color:#00c8ff}

/* Manual scan */
.scanrow{margin:0 8px 8px}
.scan-l{font-size:9px;color:#475569;margin-bottom:3px}
.scan-wrap{display:flex}
.scan-in{
  flex:1;padding:7px 9px;background:#0d1526;border:1px solid #1e3354;
  border-radius:6px 0 0 6px;color:#e2e8f0;font-size:11px;outline:none;
}
.scan-in:focus{border-color:#00c8ff}
.scan-btn{
  padding:7px 12px;background:#1565c0;color:#fff;border:none;
  border-radius:0 6px 6px 0;cursor:pointer;font-size:11px;font-weight:600;
}

/* ═══ CHAT PANEL ═══ */
#chatPanel{
  position:absolute;inset:0;background:#060d1a;z-index:100;
  display:none;flex-direction:column;
}
#chatPanel.open{display:flex}
.chat-hdr2{
  background:linear-gradient(135deg,#3b0764,#4c1d95,#5b21b6);
  padding:12px 14px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid #4c1d95;flex-shrink:0;
}
.chat-hdr2-title{font-size:13px;font-weight:800;color:#e9d5ff;flex:1}
.chat-hdr2-mode{font-size:9px;color:#a78bfa;margin-top:2px}
.chat-close{
  background:rgba(255,255,255,.1);border:none;color:#e9d5ff;
  width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.chat-close:hover{background:#ef444466;transform:rotate(90deg)}
.chat-ctx{
  background:#1a0f2e;padding:6px 14px;font-size:10px;color:#a78bfa;
  display:flex;align-items:center;gap:6px;border-bottom:1px solid #2d1b69;flex-shrink:0;
}
.chat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chat-msgs{
  flex:1;overflow-y:auto;padding:10px 8px;
  display:flex;flex-direction:column;gap:7px;
}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:#1e3354;border-radius:2px}
.cmsg{display:flex;flex-direction:column;max-width:92%}
.cmsg.user{align-self:flex-end;align-items:flex-end}
.cmsg.bot{align-self:flex-start;align-items:flex-start}
.cmsg-b{
  padding:8px 11px;border-radius:11px;font-size:11.5px;
  line-height:1.6;white-space:pre-wrap;word-break:break-word;
}
.cmsg.user .cmsg-b{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:11px 11px 3px 11px}
.cmsg.bot  .cmsg-b{background:#0d1526;color:#e2e8f0;border:1px solid #1e3354;border-radius:11px 11px 11px 3px}
.cmsg-b strong{font-weight:800;color:#a78bfa}
.cmsg-b code{background:#060d1a;padding:1px 4px;border-radius:3px;font-family:monospace;font-size:10px;color:#60a5fa}
.cmsg-time{font-size:9px;color:#334155;margin-top:2px;padding:0 3px}
.typing2{
  display:flex;align-items:center;gap:3px;padding:8px 11px;
  background:#0d1526;border-radius:11px;border:1px solid #1e3354;width:fit-content;
}
.typing2 span{
  width:6px;height:6px;border-radius:50%;background:#a78bfa;
  animation:typingDot 1.2s ease infinite;
}
.typing2 span:nth-child(2){animation-delay:.2s}
.typing2 span:nth-child(3){animation-delay:.4s}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:5px 8px;flex-shrink:0}
.chip{
  padding:4px 9px;background:#0d1526;border:1px solid #1e3354;
  border-radius:16px;font-size:10px;color:#94a3b8;cursor:pointer;
  transition:all .2s;font-family:inherit;
}
.chip:hover{background:#1a0f2e;border-color:#7c3aed;color:#e9d5ff}
.chat-input-row{
  padding:8px 8px;border-top:1px solid #0d1526;
  display:flex;gap:6px;align-items:flex-end;flex-shrink:0;
  background:#060d1a;
}
.chat-in{
  flex:1;background:#0d1526;border:1px solid #1e3354;border-radius:9px;
  padding:7px 10px;color:#e2e8f0;font-size:11px;outline:none;
  resize:none;max-height:60px;font-family:inherit;line-height:1.5;
}
.chat-in:focus{border-color:#7c3aed}
.chat-go{
  width:32px;height:32px;background:linear-gradient(135deg,#6d28d9,#7c3aed);
  border:none;border-radius:9px;cursor:pointer;color:#fff;font-size:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-weight:900;transition:all .2s;
}
.chat-go:hover{filter:brightness(1.2)}

.footer{text-align:center;padding:5px;font-size:9px;color:#1e3354;border-top:1px solid #0d1526}
</style>
</head>
<body>

<!-- MAIN VIEW -->
<div id="mainView">
  <div class="hdr">
    <div class="hdr-logo">🛡️</div>
    <div style="flex:1">
      <div class="hdr-title">
        WTI SHIELD
        <span class="api-dot off" id="apiDot"></span>
      </div>
      <div class="hdr-sub" id="apiLbl">Checking ML API...</div>
    </div>
    <div style="font-size:10px;color:#334155">v9.0</div>
  </div>

  <div class="card card-scanning" id="card">
    <div class="ci" id="ci">⏳</div>
    <div class="cl" id="cl">Scanning...</div>
    <div class="cu" id="cu">Analyzing current page</div>
    <div class="cs" id="cs"></div>
    <div class="cbar"><div class="cbar-fill" id="cfill" style="width:0%"></div></div>
    <div class="cbar-txt" id="ctxt">—</div>
  </div>

  <div class="btns" id="btns">
    <button class="btn btn-report" id="reportBtn">📋 View Report</button>
    <button class="btn btn-chat" id="chatBtn">
      🤖 Ask AI
      <span class="chat-notif" id="chatNotif" style="display:none">!</span>
    </button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="nScanned">0</div><div class="stat-l">Scanned</div></div>
    <div class="stat"><div class="stat-n" id="nThreats" style="color:#ef4444">0</div><div class="stat-l">Threats</div></div>
  </div>

  <div class="trows">
    <div class="tr"><div class="td" style="background:#ef4444"></div><span class="tn">SQL Injection</span><span class="tc2" id="c-sql">0</span></div>
    <div class="tr"><div class="td" style="background:#f97316"></div><span class="tn">XSS Attack</span>   <span class="tc2" id="c-xss">0</span></div>
    <div class="tr"><div class="td" style="background:#a855f7"></div><span class="tn">Web Threat</span>   <span class="tc2" id="c-ph">0</span></div>
    <div class="tr"><div class="td" style="background:#3b82f6"></div><span class="tn">DDoS</span>         <span class="tc2" id="c-ddos">0</span></div>
  </div>

  <div class="scanrow">
    <div class="scan-l">🔍 Scan any URL manually:</div>
    <div class="scan-wrap">
      <input class="scan-in" id="scanIn" placeholder="http://paypal-login.tk/verify">
      <button class="scan-btn" id="scanBtn">Scan</button>
    </div>
  </div>

  <div class="footer">Dynamic Web Threat Intelligence · Final Year Project · AI & DS</div>
</div>

<!-- CHAT PANEL -->
<div id="chatPanel">
  <div class="chat-hdr2">
    <div style="flex:1">
      <div class="chat-hdr2-title">🤖 AI Security Assistant</div>
      <div class="chat-hdr2-mode" id="chatMode">Checking connection...</div>
    </div>
    <button class="chat-close" id="chatClose">✕</button>
  </div>
  <div class="chat-ctx" id="chatCtx">
    <div class="chat-dot" id="ctxDot" style="background:#22c55e"></div>
    <span id="ctxTxt">Analyzing...</span>
  </div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chips" id="chips"></div>
  <div class="chat-input-row">
    <textarea class="chat-in" id="chatIn" placeholder="Ask about this threat..." rows="1"></textarea>
    <button class="chat-go" id="chatGo">➤</button>
  </div>
</div>

<script src="../assistant/assistant.js"></script>
<script src="popup.js"></script>
</body>
</html>
